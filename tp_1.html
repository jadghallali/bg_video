    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
        }
       
        #dv1{
            top: 0;

        }
        ul{

        }
        .nav-link {
            color:  darkgray;
            font-family: 'Courier New', Courier, monospace, Times, serif;
            font-size: 20px;
        }
        nav ul {
  list-style: none; /* Supprime les puces de la liste */
  padding: 0;
  margin: 0;
  display: flex; /* Aligne les éléments horizontalement */
}

nav ul li a {
  text-decoration: none; /* Supprime le soulignement par défaut des liens */
  color: #FFFFFF; /* Couleur du texte (blanc) */
  padding: 10px 20px; /* Ajoute de l'espace autour du texte */
  position: relative; /* Permet de positionner le surlignement */
  transition: color 0.3s ease; /* Animation de la couleur du texte */
}

nav ul li a::before {
  content: ""; /* Crée un élément vide pour le surlignement */
  position: absolute; /* Positionne l'élément par rapport au lien */
  bottom: 0; /* Place le surlignement en bas du lien */
  left: 0; /* Commence le surlignement à gauche */
  width: 0; /* Largeur initiale nulle */
  height: 2px; /* Hauteur du surlignement */
  background-color: #FFCC66; /* Couleur du surlignement (jaune/orange clair) */
  transition: width 0.3s ease; /* Animation de la largeur du surlignement */
}

nav ul li a:hover {
  color: #FFCC66; /* Change la couleur du texte au survol */ 
}

nav ul li a:hover::before {
  width: 100%; /* Anime la largeur du surlignement pour qu'il s'étende sur tout le lien */
}
#dv2{
    backdrop-filter: blur(20px);
}
#dv3{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
    </style>
</head>
